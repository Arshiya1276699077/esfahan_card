<script>
  function showPersianDateTime() {
    const now = new Date();

    const parts = new Intl.DateTimeFormat("fa-IR-u-ca-persian", {
      timeZone: "Asia/Tehran",
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false
    }).formatToParts(now);

    let weekDay = "";
    let dayNumber = "";
    let monthName = "";
    let yearNumber = "";
    let hour = "";
    let minute = "";
    let second = "";

    parts.forEach(function (part) {
      if (part.type === "weekday") weekDay = part.value;
      if (part.type === "day") dayNumber = part.value;
      if (part.type === "month") monthName = part.value;
      if (part.type === "year") yearNumber = part.value;
      if (part.type === "hour") hour = part.value;
      if (part.type === "minute") minute = part.value;
      if (part.type === "second") second = part.value;
    });

    document.getElementById("weekDay").textContent = weekDay;
    document.getElementById("dayNumber").textContent = dayNumber;
    document.getElementById("monthName").textContent = monthName;
    document.getElementById("yearNumber").textContent = yearNumber + "،";
    document.getElementById("timeValue").textContent =
      hour + ":" + minute + ":" + second;
  }

  showPersianDateTime();
  setInterval(showPersianDateTime, 1000);
</script>

<div id="numberBox">

    oninput="this.value = toPersianDigits(this.value).replace(/[^۰-۹]/g, '')"
  >

  </button>

<p id="numberMessage"></p>

<script>
  function toPersianDigits(value) {
    return String(value)
      .replace(/[0-9]/g, function (digit) {
        return "۰۱۲۳۴۵۶۷۸۹"[Number(digit)];
      })
      .replace(/[٠-٩]/g, function (digit) {
        return "۰۱۲۳۴۵۶۷۸۹"["٠١٢٣٤٥٦٧٨٩".indexOf(digit)];
      });
  }
    function toEnglishDigits(value) {
    return String(value)
        .replace(/[۰-۹]/g, function (digit) {
        return "۰۱۲۳۴۵۶۷۸۹".indexOf(digit);
        })
        .replace(/[٠-٩]/g, function (digit) {
        return "٠١٢٣٤٥٦٧٨٩".indexOf(digit);
        });
    }
  function saveMainNumber() {
    const input = document.getElementById("mainNumberInput");
    const number = toPersianDigits(input.value.trim())
      .replace(/[^۰-۹]/g, "");

    if (number === "") {
      document.getElementById("numberMessage").textContent =
        "لطفاً موجودی را به ریال وارد کنید";
      return;
    }

    localStorage.setItem("balance", toEnglishDigits(number));
    showSavedNumber();
  }

  function showSavedNumber() {
    const savedNumber = localStorage.getItem("balance");
    const numberBox = document.getElementById("numberBox");
    const message = document.getElementById("numberMessage");

    if (savedNumber) {
      numberBox.style.display = "none";
      message.textContent =
  "موجودی شما: " + Number(savedNumber).toLocaleString("fa-IR") + " ریال";
    }
  }

  showSavedNumber();
</script>
