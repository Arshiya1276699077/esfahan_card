<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>فراموشی رمز عبور</title>
  <link rel="icon" type="image/png" href="/esfahan_card.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>

<style>
  * {
    font-family: Vazirmatn, Tahoma, sans-serif;
  }

  input,
  button {
    font-family: Vazirmatn, Tahoma, sans-serif;
  }
</style>
<style>
    body{
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 20px;
        direction: rtl;
    }
</style>
<script>
    function toPersianDigits(value) {
        return String(value)
            .replace(/[0-9]/g, function (digit) {
                return "۰۱۲۳۴۵۶۷۸۹"[Number(digit)];
            })
            .replace(/[٠-٩]/g, function (digit) {
                return "۰۱۲۳۴۵۶۷۸۹"["٠١٢٣٤٥٦٧٨٩".indexOf(digit)];
            });
    }
</script>
<style>
  * {
    box-sizing: border-box;
    font-family: Vazirmatn, Tahoma, sans-serif;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
    direction: rtl;
  }

  input,
  button {
    font-family: Vazirmatn, Tahoma, sans-serif;
  }

  input {
    width: 230px;
    padding: 12px;
    text-align: center;
    border: 1px solid #aaa;
    border-radius: 6px;
  }

  button {
    background-color: gray;
    color: white;
    width: 120px;
    height: 40px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.3s;
  }

  button:hover,
  button:active {
    background-color: black;
  }

  #message {
    min-height: 24px;
    margin: 0;
    text-align: center;
  }
</style>
<div class="field">
    <label for="username">نام کاربری</label>
    <input
    type="text"
    id="username"
    maxlength="10"
    inputmode="numeric"
    placeholder="نام کاربری خود را وارد کنید"
    oninput="this.value = toPersianDigits(this.value).replace(/[^۰-۹]/g, '')"
    >
</div>
<div class="field">
    <label for="password">شماره موبایل</label>
    <input
    type="text"
    id="phone"
    maxlength="11"
    inputmode="numeric"
    placeholder="شماره موبایل امنیتی را وارد کنید"
    oninput="this.value = toPersianDigits(this.value).replace(/[^۰-۹]/g, '')"
    >
</div>
<style>
    .field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field label {
  font-size: 15px;
  text-align: right;
}

.field input {
  width: 310px;
  height: 45px;
  padding: 0 12px;
  font-size: 15px;
}
</style>
<p id="message"></p>
<script>
  function checkUser() {
    const username = toPersianDigits(
      document.getElementById("username").value.trim()
    );

    const phone = toPersianDigits(
      document.getElementById("phone").value.trim()
    );

    const message = document.getElementById("message");

    if (username === "" && phone === "") {
      message.textContent =
        "لطفاً نام کاربری و شماره موبایل را وارد کنید";
    } else if (username === "") {
      message.textContent =
        "لطفاً نام کاربری را وارد کنید";
    } else if (phone === "") {
      message.textContent =
        "لطفاً شماره موبایل را وارد کنید";
    } else if (
      username === "۱۲۷۶۶۹۹۰۷۷" &&
      phone === "۰۹۳۶۱۷۹۰۶۰۲"
    ) {
      message.textContent = "۶۷۶۵۷۶۳۷۳۷";
    } else {
      message.textContent = "اطلاعات واردشده صحیح نیست";
    }
  }
</script>
<button type="button" onclick="checkUser()">
    بررسی
</button>
<script>
    function Khoroj(){
        window.location.href = "Login.html"
    }
</script>
<button type="button" onclick="Khoroj()">
    خروج
</button>
</body>
</html>
