<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ثبت ریز تراکنش</title>
  <link rel="icon" type="image/png" href="/esfahan_card.png">
  <link rel="stylesheet" href="app.css">
  <script
    type="module"
    src="https://cdn.jsdelivr.net/npm/persian-datepicker-element@1.1.18/dist/persian-datepicker-element.min.esm.js">
</script>
</head>
<body>

<style>
  * {
    font-family: Vazirmatn, Tahoma, sans-serif;
  }

  input,
  button {
    font-family: Vazirmatn, Tahoma, sans-serif;
  }
</style>
<style>
    body{
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 20px;
        direction: rtl;
    }
</style>
<script>
    function toPersianDigits(value) {
    return String(value)
        .replace(/[0-9]/g, function (digit) {
        return "۰۱۲۳۴۵۶۷۸۹"[Number(digit)];
        })
        .replace(/[٠-٩]/g, function (digit) {
        return "۰۱۲۳۴۵۶۷۸۹"["٠١٢٣٤٥٦٧٨٩".indexOf(digit)];
        });
    }
    function toEnglishDigits(value) {
    return String(value)
        .replace(/[۰-۹]/g, function (digit) {
        return "۰۱۲۳۴۵۶۷۸۹".indexOf(digit);
        })
        .replace(/[٠-٩]/g, function (digit) {
        return "٠١٢٣٤٥٦٧٨٩".indexOf(digit);
        });
    }
</script>
<style>
  * {
    box-sizing: border-box;
    font-family: Vazirmatn, Tahoma, sans-serif;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
    direction: rtl;
  }

  input,
  button {
    font-family: Vazirmatn, Tahoma, sans-serif;
  }

  input {
    width: 220px;
    padding: 12px;
    text-align: center;
    border: 1px solid #aaa;
    border-radius: 6px;
  }

  button {
    background-color: gray;
    color: white;
    width: 120px;
    height: 40px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.3s;
  }

  button:hover,
  button:active {
    background-color: black;
  }

  #message {
    min-height: 24px;
    margin: 0;
    text-align: center;
  }
</style>
<h2>ثبت ریز تراکنش برداشت</h2>

<p>
  موجودی فعلی:
  <span id="balanceValue">۰</span>
  ریال
</p>

<div class="transaction-form">

  <label for="fare">تعرفه</label>
  <input
    type="text"
    id="fare"
    inputmode="numeric"
    placeholder="مبلغ تعرفه به ریال"
    oninput="this.value = toPersianDigits(this.value).replace(/[^۰-۹]/g, '')"
  >

  <label for="busLine">خط اتوبوس</label>
  <input
    type="text"
    id="busLine"
    placeholder="مثلاً خط ۱۲"
    oninput="this.value = toPersianDigits(this.value)"
  >

  <label for="origin">مبدأ</label>
  <input
    type="text"
    id="origin"
    placeholder="مبدأ را وارد کنید"
  >

  <label for="destination">مقصد</label>
  <input
    type="text"
    id="destination"
    placeholder="مقصد را وارد کنید"
  >

<label for="datePicker">تاریخ شمسی</label>

<persian-datepicker-element
  id="datePicker"
  placeholder="تاریخ را انتخاب کنید"
  format="YYYY/MM/DD"
  rtl>
</persian-datepicker-element>

<input
  type="hidden"
  id="transactionDate"
>

  <label for="transactionTime">ساعت</label>
  <input
    type="text"
    id="transactionTime"
    inputmode="numeric"
    maxlength="7"
    placeholder="۱۶:۳۰:۳۰"
    oninput="this.value = toPersianDigits(this.value)"
  >

  <button type="button" onclick="saveTransaction()">
    ثبت ریز تراکنش
  </button>
  <button type="button" onclick="Bazgasht()">
    بازگشت
  </button>

</div>

<p id="transactionMessage"></p>

<style>
  .transaction-form {
    width: 310px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .transaction-form input {
    width: 100%;
  }

  .transaction-form label {
    text-align: right;
  }

  #transactionMessage {
    min-height: 24px;
    text-align: center;
  }
</style>

<script>
  function showBalance() {
    const balance = Number(
      localStorage.getItem("balance") || "0"
    );

    document.getElementById("balanceValue").textContent =
      balance.toLocaleString("fa-IR");
  }

  function isValidPersianDate(value) {
    const englishDate = toEnglishDigits(value);

    const match = englishDate.match(
      /^(\d{4})\/(\d{2})\/(\d{2})$/
    );

    if (!match) {
      return false;
    }

    const month = Number(match[2]);
    const day = Number(match[3]);

    if (month < 1 || month > 12) {
      return false;
    }

    let maximumDay;

    if (month <= 6) {
      maximumDay = 31;
    } else if (month <= 11) {
      maximumDay = 30;
    } else {
      maximumDay = 30;
    }

    return day >= 1 && day <= maximumDay;
  }

  function isValidTime(value) {
    const englishTime = toEnglishDigits(value);

    return /^([01]\d|2[0-3]):[0-5]\d$/.test(
      englishTime
    );
  }

  function saveTransaction() {
    const fareInput =
      document.getElementById("fare");

    const busLineInput =
      document.getElementById("busLine");

    const originInput =
      document.getElementById("origin");

    const destinationInput =
      document.getElementById("destination");

    const dateInput =
      document.getElementById("transactionDate");

    const timeInput =
      document.getElementById("transactionTime");

    const message =
      document.getElementById("transactionMessage");

    const fare = Number(
      toEnglishDigits(fareInput.value.trim())
    );

    const busLine =
      busLineInput.value.trim();

    const origin =
      originInput.value.trim();

    const destination =
      destinationInput.value.trim();

    const transactionDate =
      toPersianDigits(dateInput.value.trim());

    const transactionTime =
      toPersianDigits(timeInput.value.trim());

    if (!Number.isFinite(fare) || fare <= 0) {
      showMessage(
        "لطفاً تعرفه معتبر وارد کنید",
        "red"
      );
      return;
    }

    if (busLine === "") {
      showMessage(
        "لطفاً خط اتوبوس را وارد کنید",
        "red"
      );
      return;
    }

    if (origin === "") {
      showMessage(
        "لطفاً مبدأ را وارد کنید",
        "red"
      );
      return;
    }

    if (destination === "") {
      showMessage(
        "لطفاً مقصد را وارد کنید",
        "red"
      );
      return;
    }

    if (!isValidPersianDate(transactionDate)) {
      showMessage(
        "تاریخ را مانند ۱۴۰۵/۰۵/۱۲ وارد کنید",
        "red"
      );
      return;
    }

    if (!isValidTime(transactionTime)) {
      showMessage(
        "ساعت را مانند ۱۶:۳۰ وارد کنید",
        "red"
      );
      return;
    }

    const currentBalance = Number(
      localStorage.getItem("balance") || "0"
    );

    if (fare > currentBalance) {
      showMessage(
        "موجودی برای این برداشت کافی نیست",
        "red"
      );
      return;
    }

    const newBalance = currentBalance - fare;

    const transactions = JSON.parse(
      localStorage.getItem("transactions") || "[]"
    );

    const newTransaction = {
      id: Date.now(),
      type: "withdrawal",
      fare: fare,
      busLine: busLine,
      origin: origin,
      destination: destination,
      date: transactionDate,
      time: transactionTime
    };

    transactions.push(newTransaction);

    localStorage.setItem(
      "transactions",
      JSON.stringify(transactions)
    );

    localStorage.setItem(
      "balance",
      String(newBalance)
    );

    showBalance();

    showMessage(
      "ریز تراکنش با موفقیت ثبت شد",
      "green"
    );

    clearTransactionForm();
  }

  function showMessage(text, color) {
    const message =
      document.getElementById("transactionMessage");

    message.textContent = text;
    message.style.color = color;
  }

  function clearTransactionForm() {
    document.getElementById("fare").value = "";
    document.getElementById("busLine").value = "";
    document.getElementById("origin").value = "";
    document.getElementById("destination").value = "";
    document.getElementById("transactionDate").value = "";
    document.getElementById("transactionTime").value = "";
    document.getElementById("transactionDate").value = "";
    document.getElementById("datePicker").clear();
  }

  document.addEventListener(
    "DOMContentLoaded",
    showBalance
  );
</script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const datePicker =
      document.getElementById("datePicker");

    const transactionDate =
      document.getElementById("transactionDate");

    datePicker.addEventListener("change", function (event) {
      const jalaliDate = event.detail.jalali;

      const year = jalaliDate[0];
      const month = String(jalaliDate[1]).padStart(2, "0");
      const day = String(jalaliDate[2]).padStart(2, "0");

      transactionDate.value = toPersianDigits(
        year + "/" + month + "/" + day
      );
    });
  });
</script>
<style>
    #datePicker {
    display: block;
    width: 100%;

    --jdp-primary: gray;
    --jdp-primary-hover: black;
    --jdp-font-family: Vazirmatn, Tahoma, sans-serif;
    }
</style>
<script>
    function Bazgasht() {
        window.location.href = "Panel.html"
    }
</script>
</body>
</html>
